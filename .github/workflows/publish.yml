name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: work out release metadata
        id: meta
        run: |
          set -euo pipefail
          MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          case "$MC" in
            26.1.2)
              GV_RAW='26.1,26.1.1,26.1.2'
              ;;
            *)
              MC_RANGE="~$MC"
              GV_RAW="$MC"
              ;;
          esac
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == *+* ]] || VERSION="$VERSION+$MC"
          GAME_VERSIONS="$(printf '%s' "$GV_RAW" | tr ',' '\n')"
          {
            echo "version=$VERSION"
            echo "game_versions<<GAME_VERSIONS_EOF"
            echo "$GAME_VERSIONS"
            echo "GAME_VERSIONS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: build mod
        env:
          MOD_VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew build -Pmod_version="$MOD_VERSION"

      - name: pick the mod jar
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)
          test -n "$JAR"
          echo "Publishing $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ secrets.MODRINTH_PROJECT_ID }}
          version: ${{ steps.meta.outputs.version }}
          name: NowPlayingSys ${{ steps.meta.outputs.version }} for Minecraft 26.1.x
          channel: release
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.game_versions }}
          dependencies: '[{"project_id":"P7dR8mSH","dependency_type":"required"}]'
          files: ${{ steps.jar.outputs.path }}
